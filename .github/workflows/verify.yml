name: Verify source release
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: macos-14
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install pinned application dependencies
        run: python -m pip install -r requirements.txt
      - name: Backend integration and security coverage (minimum 80 percent)
        run: python tests/run_coverage.py
      - name: Frontend workflow regression checks
        run: |
          node --check public/app.js
          node --check public/team.js
          node tests/test_frontend.mjs
          node tests/test_frontend_followup.mjs
          node tests/test_frontend_security.mjs
          node tests/test_frontend_core.mjs
      - name: Build and check clean public source
        run: |
          python scripts/package_release.py
          python tests/probe_release.py
          python scripts/package_public.py
          python tests/probe_public_release.py
