name: Build and test offline installers
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  installer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
          - os: ubuntu-24.04
            target: linux-x64
          - os: macos-14
            target: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Installer safety regressions
        run: python -m unittest discover -s tests -p test_installer.py -v
      - name: Build clean source and native offline kit
        run: |
          python scripts/package_release.py
          python scripts/package_public.py
          python tests/probe_public_release.py
          python scripts/package_installers.py --target ${{ matrix.target }}
      - name: Native installation, launch and uninstall acceptance
        if: runner.os != 'macOS'
        run: python tests/probe_installer.py
      - name: Native macOS acceptance in a disposable test home
        if: runner.os == 'macOS'
        run: python scripts/test_installer_macos.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: openpeople-${{ matrix.target }}-installer
          if-no-files-found: error
          path: |
            release/*-installer.zip
            release/*-SHA256SUMS.txt
            release/*-installers.json
